{% extends "base.html" %}

{% block content %}
{% load i18n %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-5">
        <h1>{% if conge %}{% trans "Modifier" %}{% else %}{% trans "Ajouter" %}{% endif %} {% trans "un congé" %}</h1>
        <div>
            <a href="{% url 'list_conges' %}" class="btn btn-danger">{% trans "Annuler" %}</a>
            <button type="submit" form="conge-form" class="btn btn-success" id="submit-btn">{% trans "Enregistrer" %}</button>
        </div>
    </div>

    <form id="conge-form" method="post">
        {% csrf_token %}
        
        <div class="card mb-3">
            <div class="card-body">
                <div class="form-group mb-3">
                    <label for="dateDemande">{% trans "Date de demande" %}</label>
                    <input type="date" class="form-control" id="dateDemande" name="dateDemande"
                           value="{{ conge.dateDemande|default:'' }}" 
                           min="{{ date_min }}" 
                           max="{{ date_max }}" 
                           required>
                    <div class="validation-icon" id="demande-icon"></div>
                    <div class="error-message" id="demande-error"></div>
                </div>

                <div class="form-group mb-3">
                    <label for="DateDeb">{% trans "Date de début" %}</label>
                    <input type="datetime-local" class="form-control" id="DateDeb" name="DateDeb"
                           value="{{ conge.DateDeb|date:'Y-m-d\TH:i'|default:'' }}"
                           min="{{ date_min }}" 
                           max="{{ date_max }}" 
                           required>
                    <div class="validation-icon" id="debut-icon"></div>
                    <div class="error-message" id="debut-error"></div>
                </div>

                <div class="form-group mb-3" id="date-fin-group">
                    <label for="DateFin">{% trans "Date de fin" %}</label>
                    <input type="datetime-local" class="form-control" id="DateFin" name="DateFin"
                           value="{{ conge.DateFin|date:'Y-m-d\TH:i'|default:'' }}"
                           min="{{ date_min }}" 
                           max="{{ date_max }}" 
                           required>
                    <div class="validation-icon" id="fin-icon"></div>
                    <div class="error-message" id="fin-error"></div>
                </div>

                <div class="form-group mb-3" id="motif-group">
                    <label for="MotifCo">{% trans "Motif" %}</label>
                    <textarea class="form-control" id="MotifCo" name="MotifCo" rows="3"
                              required>{{ conge.MotifCo|default:'' }}</textarea>
                    <div class="validation-icon" id="motif-icon"></div>
                    <div class="error-message" id="motif-error"></div>
                </div>

                <div class="form-group mb-3" id="responsable-group">
                    <label for="matricule_responsable">{% trans "Responsable" %}</label>
                    <select id="matricule_responsable" name="matricule_responsable" class="form-control" required>
                        <option value="">-- {% trans "Sélectionner un responsable" %} --</option>
                        {% for employe in employes %}
                        <option value="{{ employe.matricule }}" {% if conge and conge.matricule_responsable.matricule == employe.matricule %}selected{% endif %}>
                            {{ employe.nom }} {{ employe.prenom }}
                        </option>
                        {% endfor %}
                    </select>
                    <div class="validation-icon" id="resp-icon"></div>
                    <div class="error-message" id="resp-error"></div>
                </div>

                <div class="form-group mb-4">
                    <label>{% trans "Employé(e)" %}</label>
                    <input type="text" class="form-control" value="{{ employe_connecte.nom }} {{ employe_connecte.prenom }}" readonly>
                </div>
            </div>
        </div>
    </form>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <style>
        .error-toast {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            min-width: 300px;
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        .form-control.error {
            border-color: #dc3545;
            box-shadow: 0 0 0 0.2rem rgba(220, 53, 69, 0.25);
        }
        
        .form-control:disabled {
            background-color: #f8f9fa;
            opacity: 0.6;
        }
        
        .field-disabled {
            pointer-events: none;
            opacity: 0.6;
        }
        
        .error-message {
            color: #dc3545;
            font-size: 0.875rem;
            margin-top: 0.25rem;
            display: none;
        }
        
        .validation-icon {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.2rem;
            z-index: 10;
        }
        
        .form-group {
            position: relative;
        }
        
        .toast {
            border: none;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
        }
        
        .btn-close-white {
            filter: invert(1) grayscale(100%) brightness(200%);
        }
    </style>

    <script>
        class CongeFormValidator {
            constructor() {
                this.currentYear = new Date().getFullYear();
                this.minYear = this.currentYear - 2;
                this.maxYear = this.currentYear + 1;
                this.validationState = {
                    dateDemande: false,
                    dateDebut: false,
                    dateFin: false,
                    motif: false,
                    responsable: false
                };
                this.isEditMode = document.querySelector('[name="conge"]') !== null || 
                                 document.querySelector('input[value*="{{ conge.dateDemande }}"]') !== null;
                
                this.init();
            }
            
            init() {
                // Définir la date d'aujourd'hui pour la date de demande si pas en mode édition
                if (!this.isEditMode) {
                    var today = new Date().toISOString().split('T')[0];
                    if (!document.getElementById('dateDemande').value) {
                        document.getElementById('dateDemande').value = today;
                    }
                }
                
                // Ajouter les écouteurs d'événements
                this.addEventListeners();
                
                // Si c'est le mode édition, valider les champs existants
                if (this.isEditMode) {
                    this.validateExistingData();
                } else {
                    // En mode création, désactiver les champs suivants
                    this.disableField('DateFin');
                    this.disableNextFields();
                }
            }
            
            validateExistingData() {
                // Valider les champs existants en mode édition
                this.validateDateDemande(document.getElementById('dateDemande').value);
                this.validateDateDebut(document.getElementById('DateDeb').value);
                this.validateDateFin(document.getElementById('DateFin').value);
                this.validateMotif(document.getElementById('MotifCo').value);
                this.validateResponsable(document.getElementById('matricule_responsable').value);
            }
            
            addEventListeners() {
                // Validation en temps réel pour la date de demande
                document.getElementById('dateDemande').addEventListener('change', (e) => {
                    this.validateDateDemande(e.target.value);
                });
                
                // Validation en temps réel pour la date de début
                document.getElementById('DateDeb').addEventListener('change', (e) => {
                    this.validateDateDebut(e.target.value);
                });
                
                // Validation en temps réel pour la date de fin
                document.getElementById('DateFin').addEventListener('change', (e) => {
                    this.validateDateFin(e.target.value);
                });
                
                // Validation en temps réel pour le motif
                document.getElementById('MotifCo').addEventListener('input', (e) => {
                    this.validateMotif(e.target.value);
                });
                
                // Validation pour le responsable
                document.getElementById('matricule_responsable').addEventListener('change', (e) => {
                    this.validateResponsable(e.target.value);
                });
                
                // Prévenir la soumission si invalide
                document.getElementById('conge-form').addEventListener('submit', (e) => {
                    if (!this.isFormValid()) {
                        e.preventDefault();
                        this.showToast('{% trans "Veuillez corriger les erreurs avant de soumettre le formulaire" %}', 'error');
                        return false;
                    }
                });
            }
            
            validateDateDemande(value) {
                if (!value) {
                    this.updateValidationState('dateDemande', false);
                    this.clearFieldValidation('dateDemande', 'demande-error', 'demande-icon');
                    this.updateFormState();
                    return;
                }
                
                const date = new Date(value);
                const year = date.getFullYear();
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                date.setHours(0, 0, 0, 0);
                
                let isValid = true;
                let errorMessage = '';
                
                // Vérifier l'année
                if (year < this.minYear || year > this.maxYear) {
                    isValid = false;
                    errorMessage = `{% trans "La date de demande doit être entre" %} ${this.minYear} {% trans "et" %} ${this.maxYear}`;
                }
                // Vérifier que la date n'est pas dans le futur (sauf en mode édition)
                else if (!this.isEditMode && date > today) {
                    isValid = false;
                    errorMessage = '{% trans "La date de demande ne peut pas être dans le futur" %}';
                }
                
                this.updateValidationState('dateDemande', isValid);
                
                if (!isValid) {
                    this.showFieldError('dateDemande', 'demande-error', 'demande-icon', errorMessage);
                    this.showToast(errorMessage, 'error');
                } else {
                    this.showFieldSuccess('dateDemande', 'demande-error', 'demande-icon');
                }
                
                this.updateFormState();
            }
            
            validateDateDebut(value) {
                if (!value) {
                    this.updateValidationState('dateDebut', false);
                    this.clearFieldValidation('DateDeb', 'debut-error', 'debut-icon');
                    if (!this.isEditMode) {
                        this.disableField('DateFin');
                    }
                    this.updateFormState();
                    return;
                }
                
                const date = new Date(value);
                const year = date.getFullYear();
                const dateDemande = new Date(document.getElementById('dateDemande').value);
                
                let isValid = true;
                let errorMessage = '';
                
                // Vérifier l'année
                if (year < this.minYear || year > this.maxYear) {
                    isValid = false;
                    errorMessage = `{% trans "La date de début doit être entre" %} ${this.minYear} {% trans "et" %} ${this.maxYear}`;
                }
                // Vérifier que la date de début est après ou égale à la date de demande
                else if (date < dateDemande) {
                    isValid = false;
                    errorMessage = '{% trans "La date de début doit être postérieure ou égale à la date de demande" %}';
                }
                
                this.updateValidationState('dateDebut', isValid);
                
                if (!isValid) {
                    this.showFieldError('DateDeb', 'debut-error', 'debut-icon', errorMessage);
                    this.showToast(errorMessage, 'error');
                    if (!this.isEditMode) {
                        this.disableField('DateFin');
                    }
                } else {
                    this.showFieldSuccess('DateDeb', 'debut-error', 'debut-icon');
                    if (!this.isEditMode) {
                        this.enableField('DateFin');
                    }
                    // Révalider la date de fin si elle existe
                    const dateFin = document.getElementById('DateFin').value;
                    if (dateFin) {
                        this.validateDateFin(dateFin);
                    }
                }
                
                this.updateFormState();
            }
            
            validateDateFin(value) {
                if (!value) {
                    this.updateValidationState('dateFin', false);
                    this.clearFieldValidation('DateFin', 'fin-error', 'fin-icon');
                    this.updateFormState();
                    return;
                }
                
                const dateFin = new Date(value);
                const dateDebut = new Date(document.getElementById('DateDeb').value);
                const year = dateFin.getFullYear();
                
                let isValid = true;
                let errorMessage = '';
                
                // Vérifier l'année
                if (year < this.minYear || year > this.maxYear) {
                    isValid = false;
                    errorMessage = `{% trans "La date de fin doit être entre" %} ${this.minYear} {% trans "et" %} ${this.maxYear}`;
                }
                // Vérifier que la date de fin est après la date de début
                else if (dateFin <= dateDebut) {
                    isValid = false;
                    errorMessage = '{% trans "La date de fin doit être postérieure à la date de début" %}';
                }
                
                this.updateValidationState('dateFin', isValid);
                
                if (!isValid) {
                    this.showFieldError('DateFin', 'fin-error', 'fin-icon', errorMessage);
                    this.showToast(errorMessage, 'error');
                    if (!this.isEditMode) {
                        this.disableNextFields();
                    }
                } else {
                    this.showFieldSuccess('DateFin', 'fin-error', 'fin-icon');
                    if (!this.isEditMode) {
                        this.enableNextFields();
                    }
                }
                
                this.updateFormState();
            }
            
            validateMotif(value) {
                const isValid = value.trim().length >= 4;
                this.updateValidationState('motif', isValid);
                
                if (!isValid && value.length > 0) {
                    this.showFieldError('MotifCo', 'motif-error', 'motif-icon', '{% trans "Le motif doit contenir au moins 04 caractères" %}');
                } else if (isValid) {
                    this.showFieldSuccess('MotifCo', 'motif-error', 'motif-icon');
                } else {
                    this.clearFieldValidation('MotifCo', 'motif-error', 'motif-icon');
                }
                
                this.updateFormState();
            }
            
            validateResponsable(value) {
                const isValid = value !== '';
                this.updateValidationState('responsable', isValid);
                
                if (!isValid) {
                    this.showFieldError('matricule_responsable', 'resp-error', 'resp-icon', '{% trans "Veuillez sélectionner un responsable" %}');
                } else {
                    this.showFieldSuccess('matricule_responsable', 'resp-error', 'resp-icon');
                }
                
                this.updateFormState();
            }
            
            showFieldError(fieldId, errorId, iconId, message) {
                const field = document.getElementById(fieldId);
                const errorDiv = document.getElementById(errorId);
                const icon = document.getElementById(iconId);
                
                field.classList.add('error');
                errorDiv.textContent = message;
                errorDiv.style.display = 'block';
                {% comment %} icon.innerHTML = '<i class="fas fa-times-circle"></i>';
                icon.style.color = '#dc3545'; {% endcomment %}
            }
            
            showFieldSuccess(fieldId, errorId, iconId) {
                const field = document.getElementById(fieldId);
                const errorDiv = document.getElementById(errorId);
                const icon = document.getElementById(iconId);
                
                field.classList.remove('error');
                errorDiv.style.display = 'none';
                {% comment %} icon.innerHTML = '<i class="fas fa-check-circle"></i>';
                icon.style.color = '#28a745'; {% endcomment %}
            }
            
            clearFieldValidation(fieldId, errorId, iconId) {
                const field = document.getElementById(fieldId);
                const errorDiv = document.getElementById(errorId);
                const icon = document.getElementById(iconId);
                
                field.classList.remove('error');
                errorDiv.style.display = 'none';
                icon.innerHTML = '';
            }
            
            disableField(fieldId) {
                const field = document.getElementById(fieldId);
                field.disabled = true;
                if (fieldId !== 'DateFin') {
                    field.value = '';
                }
            }
            
            enableField(fieldId) {
                const field = document.getElementById(fieldId);
                field.disabled = false;
            }
            
            disableNextFields() {
                document.getElementById('motif-group').classList.add('field-disabled');
                document.getElementById('responsable-group').classList.add('field-disabled');
                document.getElementById('MotifCo').disabled = true;
                document.getElementById('matricule_responsable').disabled = true;
                if (!this.isEditMode) {
                    document.getElementById('MotifCo').value = '';
                    document.getElementById('matricule_responsable').value = '';
                    this.updateValidationState('motif', false);
                    this.updateValidationState('responsable', false);
                }
            }
            
            enableNextFields() {
                if (this.validationState.dateDebut && this.validationState.dateFin) {
                    document.getElementById('motif-group').classList.remove('field-disabled');
                    document.getElementById('responsable-group').classList.remove('field-disabled');
                    document.getElementById('MotifCo').disabled = false;
                    document.getElementById('matricule_responsable').disabled = false;
                }
            }
            
            updateValidationState(field, isValid) {
                this.validationState[field] = isValid;
            }
            
            isFormValid() {
                return Object.values(this.validationState).every(state => state === true);
            }
            
            updateFormState() {
                const submitBtn = document.getElementById('submit-btn');
                if (this.isFormValid()) {
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('btn-secondary');
                    submitBtn.classList.add('btn-success');
                } else {
                    submitBtn.disabled = true;
                    submitBtn.classList.remove('btn-success');
                    submitBtn.classList.add('btn-secondary');
                }
            }
            
            showToast(message, type = 'error') {
                const toastContainer = document.getElementById('toast-container');
                const toastId = 'toast-' + Date.now();
                
                const toastHtml = `
                    <div class="toast error-toast show" id="${toastId}" role="alert">
                        <div class="toast-header bg-${type === 'error' ? 'danger' : 'success'} text-white">
                            <strong class="me-auto">${type === 'error' ? '<i class="fas fa-exclamation-triangle"></i> {% trans "Erreur" %}' : '<i class="fas fa-check-circle"></i> {% trans "Succès" %}'}</strong>
                            <button type="button" class="btn-close btn-close-white" onclick="this.parentElement.parentElement.remove()"></button>
                        </div>
                        <div class="toast-body">
                            ${message}
                        </div>
                    </div>
                `;
                
                toastContainer.insertAdjacentHTML('beforeend', toastHtml);
                
                // Auto-remove after 5 seconds
                setTimeout(() => {
                    const toast = document.getElementById(toastId);
                    if (toast) {
                        toast.remove();
                    }
                }, 5000);
            }
        }
        
        // Initialiser le validateur quand la page est chargée
        document.addEventListener('DOMContentLoaded', () => {
            new CongeFormValidator();
        });
    </script>
</div>
{% endblock %}
